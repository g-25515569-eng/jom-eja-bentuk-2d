<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jom Eja Bentuk 2D</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:Arial,sans-serif;background:linear-gradient(135deg,#dff6ff,#f5e8ff);color:#222}
.game{width:95%;max-width:1000px;background:#fff;border-radius:30px;padding:30px;text-align:center;box-shadow:0 15px 40px rgba(0,0,0,.15)}
h1{margin:0 0 8px;font-size:40px;color:#4b3fbf}.instruction{font-size:23px;font-weight:bold;margin-bottom:10px}
.round{font-size:17px;color:#777;margin-bottom:5px}.shape-area{height:230px;display:flex;justify-content:center;align-items:center}
.shape{filter:drop-shadow(0 8px 5px rgba(0,0,0,.18))}.triangle{width:0;height:0;border-left:100px solid transparent;border-right:100px solid transparent;border-bottom:170px solid #ffca3a}
.circle{width:170px;height:170px;border-radius:50%;background:#5bc0eb}.square{width:170px;height:170px;background:#7bd389}.rectangle{width:240px;height:150px;background:#ff8fab;border-radius:8px}
.word-title{font-size:19px;color:#666}.letters{min-height:68px;margin:12px auto;display:flex;justify-content:center;gap:7px;flex-wrap:wrap}
.letter{width:45px;height:55px;border:3px solid #4b3fbf;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:bold;background:#f4f1ff}.letter.empty{color:#bbb;background:#fafafa}
.mic-button{margin-top:10px;width:88px;height:88px;border-radius:50%;border:none;background:#4b3fbf;color:#fff;font-size:38px;cursor:pointer;box-shadow:0 8px 18px rgba(75,63,191,.35)}
.mic-button:disabled{opacity:.5;cursor:not-allowed}.mic-button.listening{background:#e63946;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.status{min-height:34px;margin-top:16px;font-size:21px;font-weight:bold}.success{color:#159447}.error{color:#e63946}
.hint{margin-top:10px;color:#777;font-size:15px}.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:18px}
.control{padding:11px 20px;border:none;border-radius:12px;background:#eee;font-size:16px;cursor:pointer}.next{background:#4b3fbf;color:#fff;display:none}
.stars{font-size:25px;min-height:34px;margin-top:5px}.debug{margin-top:8px;font-size:13px;color:#aaa;min-height:18px}
</style>
</head>
<body>
<div class="game">
<h1>🔎 JOM EJA BENTUK 2D</h1>
<div class="instruction">🎯 Eja nama bentuk ini dengan suara</div>
<div class="round" id="round"></div><div class="stars" id="stars">⭐ 0</div>
<div class="shape-area" id="shapeArea"></div>
<div class="word-title">Nama bentuk:</div><div class="letters" id="letters"></div>
<button class="mic-button" id="micButton" type="button">🎤</button>
<div class="status" id="status">Tekan mikrofon dan sebut satu huruf.</div>
<div class="hint">Sebut <b>satu huruf pada satu masa</b>, contohnya “S”, kemudian “E”, kemudian “G”.</div>
<div class="debug" id="debug"></div>
<div class="controls"><button class="control" id="resetButton" type="button">🔄 Mula Semula</button><button class="control next" id="nextButton" type="button">➡️ Bentuk Seterusnya</button></div>
</div>

<script>
const SHAPES=[
{name:"SEGI TIGA",answer:"SEGITIGA",css:"triangle"},
{name:"BULATAN",answer:"BULATAN",css:"circle"},
{name:"SEGI EMPAT SAMA",answer:"SEGIEMPATSAMA",css:"square"},
{name:"SEGI EMPAT TEPAT",answer:"SEGIEMPATTEPAT",css:"rectangle"}
];

let currentShape=0,currentIndex=0,stars=0,recognition=null;
const shapeArea=document.getElementById("shapeArea"),lettersContainer=document.getElementById("letters"),statusEl=document.getElementById("status"),debugEl=document.getElementById("debug"),micButton=document.getElementById("micButton"),resetButton=document.getElementById("resetButton"),nextButton=document.getElementById("nextButton"),roundEl=document.getElementById("round"),starsEl=document.getElementById("stars");
function current(){return SHAPES[currentShape]}
function createShape(){shapeArea.innerHTML="";const d=document.createElement("div");d.className="shape "+current().css;shapeArea.appendChild(d)}
function createLetters(){lettersContainer.innerHTML="";for(let i=0;i<current().answer.length;i++){const b=document.createElement("div");b.className="letter empty";b.id="letter-"+i;b.textContent="_";lettersContainer.appendChild(b)}}
function updateRound(){roundEl.textContent="Bentuk "+(currentShape+1)+" daripada "+SHAPES.length+" • "+current().name;starsEl.textContent="⭐ "+stars}
function setStatus(msg,cls=""){statusEl.className="status "+cls;statusEl.textContent=msg}
function loadShape(){currentIndex=0;createShape();createLetters();updateRound();debugEl.textContent="";nextButton.style.display="none";micButton.style.display="inline-block";setStatus("Tekan mikrofon dan sebut satu huruf.")}
const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
function normalize(t){return t.toUpperCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[.,!?]/g,"").trim()}

/* Penting: I dan E boleh didengar browser sebagai bunyi yang sama.
   Jadi kita semak berdasarkan huruf yang sedang diperlukan. */
function letterFromTranscript(text,expected){
 const t=normalize(text);
 const map={
 "A":"A","EI":"A","AY":"A",
 "B":"B","BI":"B","BEE":"B",
 "C":"C","SI":"C","SEE":"C",
 "D":"D","DI":"D","DEE":"D",
 "EF":"F","F":"F",
 "G":"G","JI":"G","JEE":"G",
 "H":"H","EICH":"H",
 "J":"J","JE":"J",
 "K":"K","KE":"K",
 "L":"L","EL":"L",
 "M":"M","EM":"M",
 "N":"N","EN":"N",
 "O":"O",
 "P":"P","PI":"P",
 "Q":"Q","KYU":"Q",
 "R":"R","AR":"R",
 "S":"S","ES":"S",
 "T":"T","TI":"T",
 "U":"U","YU":"U",
 "V":"V","VI":"V",
 "W":"W","DOUBLE U":"W",
 "X":"X","EKS":"X",
 "Y":"Y","WAI":"Y",
 "Z":"Z","ZED":"Z"
 };
 /* I/E ialah kes khas untuk sebutan huruf Bahasa Melayu. */
 if(t==="I"||t==="AI"){
   if(expected==="I") return "I";
   if(expected==="E") return "E";
 }
 if(t==="E"){
   if(expected==="E") return "E";
   if(expected==="I") return "I";
 }
 if(map[t]) return map[t];
 const m=t.match(/(?:HURUF\s*)?([A-Z])(?:\s*HURUF)?$/);
 if(m) return m[1];
 return "";
}

function setupRecognition(){
 if(!SpeechRecognition){setStatus("⚠️ Gunakan Chrome atau Edge untuk aktiviti suara.","error");micButton.disabled=true;return}
 recognition=new SpeechRecognition();recognition.lang="ms-MY";recognition.continuous=false;recognition.interimResults=false;recognition.maxAlternatives=8;
 recognition.onstart=()=>{micButton.classList.add("listening");setStatus("🎤 Mendengar... Sebut satu huruf.");debugEl.textContent=""};
 recognition.onend=()=>micButton.classList.remove("listening");
 recognition.onerror=e=>{micButton.classList.remove("listening");if(e.error==="not-allowed"||e.error==="service-not-allowed")setStatus("⚠️ Akses mikrofon disekat. Benarkan mikrofon untuk laman ini.","error");else if(e.error==="no-speech")setStatus("😅 Saya tak dengar. Cuba sebut huruf sekali lagi.");else setStatus("😅 Pengecaman suara gagal. Cuba lagi.")};
 recognition.onresult=e=>{
   const alternatives=e.results[0],raw=[];let detected="";
   const expected=current().answer[currentIndex];
   for(let i=0;i<alternatives.length;i++){const t=alternatives[i].transcript;raw.push(t);if(!detected)detected=letterFromTranscript(t,expected)}
   debugEl.textContent="Dikesan: "+raw.join(" | ");
   checkLetter(detected);
 };
}
function startListening(){if(!recognition)return;if(currentIndex>=current().answer.length)return;try{recognition.start()}catch(e){console.log(e)}}
function checkLetter(letter){
 if(!letter){setStatus("😅 Saya tak dapat kenal huruf itu. Cuba sebut satu huruf sahaja.");return}
 const answer=current().answer,correct=answer[currentIndex];
 if(letter===correct){
   const box=document.getElementById("letter-"+currentIndex);box.textContent=correct;box.classList.remove("empty");currentIndex++;
   if(currentIndex===answer.length){
     stars++;starsEl.textContent="⭐ "+stars;setStatus("🎉 BETUL! Awak berjaya mengeja "+current().name+"!","success");micButton.style.display="none";
     if(currentShape<SHAPES.length-1)nextButton.style.display="inline-block";else setStatus("🏆 TAHNIAH! Semua bentuk berjaya dieja! ⭐ "+stars,"success");
   }else setStatus("✅ Betul! Sekarang sebut huruf seterusnya.","success");
 }else setStatus("❌ Salah. Cuba lagi!","error");
}
function nextShape(){if(currentShape<SHAPES.length-1){currentShape++;loadShape()}}
function resetGame(){currentShape=0;stars=0;loadShape()}
micButton.addEventListener("click",startListening);nextButton.addEventListener("click",nextShape);resetButton.addEventListener("click",resetGame);
setupRecognition();loadShape();
</script>
</body>
</html>
